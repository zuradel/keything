name: update-pif

# Auto-refresh the Pixel-Canary Play-Integrity fingerprint feed (safetyfing.txt) straight from
# Google, so the rawuaiq ROM (PropsKeyboxService) always fetches a current print. A stale/beta
# fingerprint is the usual MEETS_BASIC-fail cause — this keeps us independent of the third-party
# PhoneChangerOS feed.

on:
  schedule:
    - cron: '0 */8 * * *'   # every 8 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-pif
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate fresh canary fingerprint
        run: python3 gen_safetyfing.py
      - name: Commit if changed
        run: |
          git config user.name  'pif-bot'
          git config user.email 'pif-bot@users.noreply.github.com'
          if ! git diff --quiet -- safetyfing.txt; then
            git add safetyfing.txt
            git commit -m "auto: refresh Pixel canary fingerprint"
            git push
          else
            echo "no change"
          fi
